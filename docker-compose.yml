services:
  db:
    image: postgres:15-alpine
    container_name: envoy_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: envoy_db
    # Only exposed to other containers, not the host network
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d envoy_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: envoy_redis
    restart: always
    command: redis-server --requirepass changeme
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a changeme ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: envoy_api
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    container_name: envoy_worker
    restart: always
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=1
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build: .
    container_name: envoy_beat
    restart: always
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build: .
    container_name: envoy_dashboard
    restart: always
    command: streamlit run admin_dashboard.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
